local_backend: true

backend:
  name: git-gateway

media_library:
  name: cloudinary
  config:
    cloud_name: dr0fyonps
    api_key: 391471164493191
    default_transformations:
      - - fetch_format: auto
          width: 800
          quality: auto
          crop: scale

public_folder: "/images/uploads"
media_folder: "public/images/uploads"

i18n:
  structure: multiple_folders
  locales: [en, pt, es]
  default_locale: en

collections:
  - label: "Pages"
    name: "pages"
    i18n:
      structure: single_file
      locales: [en, pt, es]
    files:
      - label: "About"
        name: "about"
        file: "content/pages/about-me.md"
        i18n: true
        fields:
          - { label: Title, name: title, widget: string, i18n: true }
          - {
              label: Description,
              name: description,
              widget: string,
              i18n: true,
            }
          - { label: Intro, name: intro, widget: markdown, i18n: true }
      - label: "Blog"
        name: "blog"
        file: "content/pages/blog.md"
        i18n: true
        fields:
          - { label: Title, name: title, widget: string, i18n: true }
          - {
              label: Description,
              name: description,
              widget: string,
              i18n: true,
            }
          - { label: Intro, name: intro, widget: markdown, i18n: true }

  - label: "Templates"
    name: "templates"
    i18n:
      structure: single_file
      locales: [en, pt, es]
    files:
      - label: "Footer"
        name: "footer"
        file: "content/templates/footer.md"
        i18n: true
        fields:
          - { label: Title, name: title, widget: string, i18n: true }
          - {
              label: Description,
              name: description,
              widget: string,
              i18n: true,
            }
          - { label: Copyrigth, name: copyrigth, widget: string, i18n: true }
          - { label: Language, name: language, widget: string, i18n: true }

  - label: "Experiences"
    name: "experiences"
    summary: "{{jobTitle}} at {{company}}"
    folder: "content/experiences"
    slug: "{{startDate}}-{{company}}"
    create: true
    i18n:
      structure: single_file
      locales: [en, pt, es]
    fields:
      - { label: Job Title, name: jobTitle, widget: string, i18n: true }
      - { label: Company, name: company, widget: string, i18n: true }
      - { label: Location, name: location, widget: string, i18n: true }
      - { label: Company Logo, name: image, widget: image, i18n: "duplicate" }
      - {
          label: Start Date,
          name: startDate,
          widget: datetime,
          i18n: "duplicate",
          date_format: "YYYY-MM-DD",
          time_format: false,
        }
      - {
          label: End Date,
          name: endDate,
          widget: datetime,
          i18n: "duplicate",
          date_format: "YYYY-MM-DD",
          time_format: false,
          required: false,
        }
      - { label: Description, name: description, widget: markdown }
      - { label: Skills, name: skills, widget: string, i18n: "duplicate" }

  - name: "blog"
    label: "Blog"
    folder: "content/blog-posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    i18n:
      structure: single_file
      locales: [en, pt, es]
    fields:
      - {
          label: "SEO",
          name: "seo",
          widget: "object",
          i18n: true,
          fields:
            [
              {
                label: "Title",
                name: "title",
                widget: "string",
                i18n: true,
                required: true,
              },
              {
                label: "Description",
                name: "description",
                widget: "string",
                i18n: true,
              },
              {
                label: "Open Graph Image",
                name: "image",
                widget: "image",
                i18n: "duplicate",
                required: false,
              },
            ],
        }
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - {
          label: "Featured Image",
          name: "thumbnail",
          widget: "image",
          i18n: duplicate,
        }
      - {
          label: "Publish Date",
          name: "date",
          widget: "datetime",
          i18n: duplicate,
        }
      - { label: "Tags", name: "tags", widget: "string", i18n: duplicate }
      - { label: "Body", name: "body", widget: "markdown", i18n: true }

  - label: "Projects"
    name: "projects"
    summary: "{{title}} ({{year}})"
    folder: "content/projects"
    slug: "{{year}}-{{slug}}"
    create: true
    i18n:
      structure: single_file
      locales: [en, pt, es]
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Year, name: year, widget: string, i18n: "duplicate" }
      - { label: Role, name: role, widget: string, i18n: true }
      - {
          label: Experience,
          name: experience,
          widget: relation,
          collection: "experiences",
          value_field: "{{slug}}",
          search_fields: ["company", "jobTitle"],
          display_fields: ["company", "jobTitle"],
          required: false,
          i18n: "duplicate",
        }
      - { label: Description, name: description, widget: text, i18n: true }
      - { label: Skills, name: skills, widget: string, i18n: "duplicate" }
      - {
          label: Live URL,
          name: liveUrl,
          widget: string,
          required: false,
          i18n: "duplicate",
        }
      - {
          label: Repository URL,
          name: repoUrl,
          widget: string,
          required: false,
          i18n: "duplicate",
        }
      - {
          label: Order,
          name: order,
          widget: number,
          required: false,
          i18n: "duplicate",
        }
      - label: Gallery
        name: gallery
        widget: list
        i18n: true
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Caption, name: caption, widget: string }
          - { label: Image, name: image, widget: image, required: false }
